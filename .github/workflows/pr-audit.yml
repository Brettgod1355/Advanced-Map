# Helper-Bot PR audit (https://github.com/Brettgod1355/Helper-Bot): Hub compliance and a deep stress test on every
# pull request. The repository is private, so the scorecard is posted on the PR, where only the owner sees it.
name: PR audit

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pr-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    # Skip drafts, and PRs from forks (GitHub gives them no identity token, and their code should not reach a
    # paid API).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: Brettgod1355/Helper-Bot/.github/workflows/pr-audit.yml@main
    with:
      run_hub_compliance: true
      run_deep_stress_test: true
      dry_run: false   # post the scorecard as one PR comment, updated on every push
    permissions:
      contents: read
      id-token: write # lets Helper-Bot reach Claude by workload identity federation; no API key
      issues: write
      pull-requests: write
